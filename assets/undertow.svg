<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <title>Abyssal — Undertow</title>
  <desc>Three sweeping currents curl around an open centre: coral above, violet below, and a cyan inner crest.</desc>
